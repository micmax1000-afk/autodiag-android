name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Blocca Ubuntu 24.04 per evitare la migrazione automatica a Ubuntu 26.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # Passa a v5: unica modifica sostanziale è il runtime Node 24
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Disabilita la cache in scrittura per evitare l'errore 400.
          # La lettura resta attiva (se esiste una cache valida, viene usata).
          cache-read-only: true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autodiag-debug
          path: app/build/outputs/apk/debug/app-debug.apk
